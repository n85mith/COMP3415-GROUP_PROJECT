<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareSight — Sign In</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #0f172a;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.5rem;
            color: #1e3a8a;
        }

        p.sub {
            margin: 0 0 1.5rem;
            color: #64748b;
            font-size: 0.9rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            padding: 0.65rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .demo-box {
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #475569;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            background: #dbeafe;
            color: #1e40af;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .panel {
            margin: 1.25rem 0;
            padding: 1rem;
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: #475569;
        }

        .logout-btn:hover {
            background: #334155;
        }

        .link-btn {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0;
            margin-top: 0.75rem;
            width: auto;
            font-weight: 500;
        }

        .link-btn:hover {
            text-decoration: underline;
            background: none;
        }
    </style>
</head>

<body>

    <!-- Login View -->
    <div class="card" id="login-view">
        <h1>CareSight</h1>
        <p class="sub">Early Warning Score & Escalation Platform</p>

        <div class="error" id="login-error"></div>

        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required />

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required />

            <button type="submit">Sign In</button>
        </form>

        <div style="text-align: center;">
            <button class="link-btn" onclick="showView('register')">Don't have an account? Sign up</button>
        </div>

        <div class="demo-box">
            <strong>Demo Clinician Account:</strong><br />
            Username: <code>clinician</code> &nbsp; Password: <code>password123</code>
        </div>
    </div>

    <!-- Register View -->
    <div class="card" id="register-view" style="display: none;">
        <h1>Create Account</h1>
        <p class="sub">Register as a Patient</p>

        <div class="error" id="register-error"></div>
        <div class="success" id="register-success"></div>

        <form id="register-form">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Enter your full name" required />

            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="Choose a username" required />

            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Minimum 6 characters" required minlength="6" />

            <button type="submit">Create Account</button>
        </form>

        <div style="text-align: center;">
            <button class="link-btn" onclick="showView('login')">Already have an account? Sign in</button>
        </div>
    </div>

    <!-- Dashboard View (Hidden until login) -->
    <div class="card" id="dashboard-view" style="display: none;">
        <span class="badge" id="user-role"></span>
        <h1 id="welcome-name" style="margin-top: 0.5rem;"></h1>
        <p class="sub">Signed in to CareSight</p>

        <div class="panel" id="role-content"></div>

        <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginError = document.getElementById('login-error');
        const registerError = document.getElementById('register-error');
        const registerSuccess = document.getElementById('register-success');

        // ── View Switching ──
        function showView(view) {
            document.getElementById('login-view').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('register-view').style.display = view === 'register' ? 'block' : 'none';
            document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'block' : 'none';

            // Clear messages when switching
            loginError.style.display = 'none';
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';
        }

        // ── Login ──
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (!res.ok) {
                loginError.textContent = data.detail || 'Login failed';
                loginError.style.display = 'block';
                return;
            }

            showDashboard(data);
        });

        // ── Register ──
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';

            const full_name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, full_name })
            });

            const data = await res.json();

            if (!res.ok) {
                registerError.textContent = data.detail || 'Registration failed';
                registerError.style.display = 'block';
                return;
            }

            // Show success and switch to login after a moment
            registerSuccess.textContent = `Account created! You can now sign in as "${data.username}".`;
            registerSuccess.style.display = 'block';
            registerForm.reset();

            setTimeout(() => showView('login'), 2000);
        });

        // ── Dashboard ──
        function showDashboard(user) {
            showView('dashboard');
            document.getElementById('user-role').textContent = user.role;
            document.getElementById('welcome-name').textContent = `Welcome, ${user.name}`;

            const content = document.getElementById('role-content');
            if (user.role === 'Clinician') {
                content.innerHTML = '<strong>Clinician View:</strong> Ready to review patient NEWS2 scores, view escalation alerts, and record clinical responses.';
            } else {
                content.innerHTML = '<strong>Patient View:</strong> Ready to view your health assessments and track your clinical observations.';
            }
        }

        function logout() {
            loginForm.reset();
            showView('login');
        }
    </script>
</body>

</html>
