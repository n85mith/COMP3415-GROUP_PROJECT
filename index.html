<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareSight — Sign In</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #0f172a;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.5rem;
            color: #1e3a8a;
        }

        p.sub {
            margin: 0 0 1.5rem;
            color: #64748b;
            font-size: 0.9rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            padding: 0.65rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .demo-box {
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #475569;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            background: #dbeafe;
            color: #1e40af;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .panel {
            margin: 1.25rem 0;
            padding: 1rem;
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: #475569;
        }

        .logout-btn:hover {
            background: #334155;
        }

        .link-btn {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0;
            margin-top: 0.75rem;
            width: auto;
            font-weight: 500;
        }

        .link-btn:hover {
            text-decoration: underline;
            background: none;
        }

        .card.wide {
            max-width: 640px;
        }

        .obs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1rem;
        }

        .obs-grid .full {
            grid-column: 1 / -1;
        }

        select {
            width: 100%;
            padding: 0.65rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }

        .field-invalid {
            border-color: #b91c1c;
            background: #fef2f2;
        }

        .field-msg {
            color: #b91c1c;
            font-size: 0.75rem;
            margin: -0.75rem 0 0.75rem;
        }

        table.breakdown {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0.75rem 0;
        }

        table.breakdown th,
        table.breakdown td {
            text-align: left;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        table.breakdown tr.three td {
            background: #fee2e2;
            color: #991b1b;
            font-weight: 700;
        }

        .risk {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .risk-Low {
            background: #dcfce7;
            color: #166534;
        }

        .risk-Low-medium {
            background: #fef9c3;
            color: #854d0e;
        }

        .risk-Medium {
            background: #ffedd5;
            color: #9a3412;
        }

        .risk-High {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert {
            margin: 0.75rem 0;
            padding: 0.75rem 1rem;
            background: #fee2e2;
            border-left: 4px solid #b91c1c;
            border-radius: 4px;
            color: #7f1d1d;
            font-size: 0.9rem;
        }

        .esc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .esc-header button {
            width: auto;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
        }

        .muted {
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="card" id="login-view">
        <h1>CareSight</h1>
        <p class="sub">Early Warning Score & Escalation Platform</p>

        <div class="error" id="login-error"></div>

        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required />

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required />

            <button type="submit">Sign In</button>
        </form>

        <div style="text-align: center;">
            <button class="link-btn" onclick="showView('register')">Don't have an account? Sign up</button>
        </div>

        <div class="demo-box">
            <strong>Demo Clinician Account:</strong><br />
            Username: <code>clinician</code> &nbsp; Password: <code>password123</code><br />
            <strong>Demo Nurse Account:</strong><br />
            Username: <code>nurse</code> &nbsp; Password: <code>password123</code>
        </div>
    </div>

    <div class="card" id="register-view" style="display: none;">
        <h1>Create Account</h1>
        <p class="sub">Register as a Patient</p>

        <div class="error" id="register-error"></div>
        <div class="success" id="register-success"></div>

        <form id="register-form">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Enter your full name" required />

            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="Choose a username" required />

            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Minimum 6 characters" required minlength="6" />

            <button type="submit">Create Account</button>
        </form>

        <div style="text-align: center;">
            <button class="link-btn" onclick="showView('login')">Already have an account? Sign in</button>
        </div>
    </div>

    <div class="card" id="dashboard-view" style="display: none;">
        <span class="badge" id="user-role"></span>
        <h1 id="welcome-name" style="margin-top: 0.5rem;"></h1>
        <p class="sub">Signed in to CareSight</p>

        <div class="panel" id="role-content"></div>

        <div id="esc-section" style="display: none;">
            <div class="esc-header">
                <h2 style="font-size: 1.1rem; color: #991b1b;">Open Escalations</h2>
                <button type="button" onclick="loadEscalations()">Refresh</button>
            </div>
            <div id="esc-list"></div>
        </div>

        <div id="obs-section" style="display: none;">
            <h2 style="font-size: 1.1rem; color: #1e3a8a;">Record Observation</h2>
            <div class="error" id="obs-error"></div>

            <form id="obs-form" novalidate>
                <div class="obs-grid">
                    <div class="full">
                        <label for="obs-patient_id">Patient ID (synthetic)</label>
                        <input type="text" id="obs-patient_id" placeholder="e.g. P-001" />
                    </div>
                    <div>
                        <label for="obs-respiratory_rate">Respiratory rate (breaths/min)</label>
                        <input type="number" id="obs-respiratory_rate" placeholder="1 - 60" />
                    </div>
                    <div>
                        <label for="obs-spo2">SpO2 (%)</label>
                        <input type="number" id="obs-spo2" placeholder="50 - 100" />
                    </div>
                    <div>
                        <label for="obs-supplemental_oxygen">Supplemental oxygen?</label>
                        <select id="obs-supplemental_oxygen">
                            <option value="">Select...</option>
                            <option value="false">No (room air)</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <div>
                        <label for="obs-systolic_bp">Systolic BP (mmHg)</label>
                        <input type="number" id="obs-systolic_bp" placeholder="40 - 300" />
                    </div>
                    <div>
                        <label for="obs-pulse">Pulse (beats/min)</label>
                        <input type="number" id="obs-pulse" placeholder="20 - 250" />
                    </div>
                    <div>
                        <label for="obs-consciousness">Consciousness</label>
                        <select id="obs-consciousness">
                            <option value="">Select...</option>
                            <option value="A">A - Alert</option>
                            <option value="C">C - New confusion</option>
                            <option value="V">V - Responds to voice</option>
                            <option value="P">P - Responds to pain</option>
                            <option value="U">U - Unresponsive</option>
                        </select>
                    </div>
                    <div>
                        <label for="obs-temperature">Temperature (&deg;C)</label>
                        <input type="number" step="0.1" id="obs-temperature" placeholder="30.0 - 43.0" />
                    </div>
                </div>
                <button type="submit">Save &amp; Score</button>
            </form>

            <div id="score-result" style="display: none;"></div>
        </div>

        <button class="logout-btn" style="margin-top: 1rem;" onclick="logout()">Sign Out</button>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginError = document.getElementById('login-error');
        const registerError = document.getElementById('register-error');
        const registerSuccess = document.getElementById('register-success');

        function showView(view) {
            document.getElementById('login-view').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('register-view').style.display = view === 'register' ? 'block' : 'none';
            document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'block' : 'none';

            loginError.style.display = 'none';
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (!res.ok) {
                loginError.textContent = data.detail || 'Login failed';
                loginError.style.display = 'block';
                return;
            }

            showDashboard(data);
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';

            const full_name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, full_name })
            });

            const data = await res.json();

            if (!res.ok) {
                registerError.textContent = data.detail || 'Registration failed';
                registerError.style.display = 'block';
                return;
            }

            registerSuccess.textContent = `Account created! You can now sign in as "${data.username}".`;
            registerSuccess.style.display = 'block';
            registerForm.reset();

            setTimeout(() => showView('login'), 2000);
        });

        let currentUser = null;

        function showDashboard(user) {
            currentUser = user;
            showView('dashboard');
            document.getElementById('user-role').textContent = user.role;
            document.getElementById('welcome-name').textContent = `Welcome, ${user.name}`;

            const isStaff = user.role === 'Nurse' || user.role === 'Clinician';
            document.getElementById('dashboard-view').classList.toggle('wide', isStaff);
            document.getElementById('obs-section').style.display = isStaff ? 'block' : 'none';
            resetObservationForm();

            const isClinician = user.role === 'Clinician';
            document.getElementById('esc-section').style.display = isClinician ? 'block' : 'none';
            if (isClinician) loadEscalations();

            const content = document.getElementById('role-content');
            if (user.role === 'Clinician') {
                content.innerHTML = '<strong>Clinician View:</strong> Record observations and review the NEWS2 score breakdown, risk level and escalation status below.';
            } else if (user.role === 'Nurse') {
                content.innerHTML = '<strong>Nurse View:</strong> Enter a patient\'s seven vital signs to see the NEWS2 score, risk level and when the next observation is due.';
            } else {
                content.innerHTML = '<strong>Patient View:</strong> Ready to view your health assessments and track your clinical observations.';
            }
        }

        function logout() {
            currentUser = null;
            loginForm.reset();
            showView('login');
        }

        const obsForm = document.getElementById('obs-form');
        const obsError = document.getElementById('obs-error');
        const scoreResult = document.getElementById('score-result');
        const OBS_NUMBER_FIELDS = ['respiratory_rate', 'spo2', 'systolic_bp', 'pulse', 'temperature'];
        const OBS_FIELDS = ['respiratory_rate', 'spo2', 'supplemental_oxygen', 'systolic_bp', 'pulse', 'consciousness', 'temperature'];

        function resetObservationForm() {
            obsForm.reset();
            obsError.style.display = 'none';
            scoreResult.style.display = 'none';
            clearFieldErrors();
        }

        function clearFieldErrors() {
            obsForm.querySelectorAll('.field-invalid').forEach(el => el.classList.remove('field-invalid'));
            obsForm.querySelectorAll('.field-msg').forEach(el => el.remove());
        }

        function markInvalid(fieldId, message) {
            const el = document.getElementById(`obs-${fieldId}`);
            if (!el) return;
            el.classList.add('field-invalid');
            const msg = document.createElement('div');
            msg.className = 'field-msg';
            msg.textContent = message;
            el.after(msg);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        obsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearFieldErrors();
            obsError.style.display = 'none';
            scoreResult.style.display = 'none';

            const body = {
                patient_id: document.getElementById('obs-patient_id').value,
                recorded_by: currentUser.username,
            };
            for (const id of OBS_FIELDS) {
                const raw = document.getElementById(`obs-${id}`).value;
                if (raw === '') continue;
                if (OBS_NUMBER_FIELDS.includes(id)) body[id] = Number(raw);
                else if (id === 'supplemental_oxygen') body[id] = raw === 'true';
                else body[id] = raw;
            }

            const res = await fetch('/api/observations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (!res.ok) {
                obsError.textContent = 'Nothing was saved. Please fix the highlighted fields.';
                obsError.style.display = 'block';
                for (const [field, message] of Object.entries(data.errors || {})) markInvalid(field, message);
                return;
            }

            renderScore(data.score, data.escalation);
            if (currentUser.role === 'Clinician') loadEscalations();
        });

        async function loadEscalations() {
            const list = document.getElementById('esc-list');
            const res = await fetch('/api/escalations');
            if (!res.ok) {
                list.innerHTML = '<p class="muted">Could not load escalations.</p>';
                return;
            }
            const items = await res.json();
            if (items.length === 0) {
                list.innerHTML = '<p class="muted">No open escalations.</p>';
                return;
            }
            const rows = items.map(e => `<tr>
                <td>${escapeHtml(e.patient_id)}</td>
                <td><span class="risk risk-${e.risk_level.replace(/\s+/g, '-')}">${escapeHtml(e.risk_level)}</span></td>
                <td>${e.total_score}</td>
                <td>${escapeHtml(e.parameters_scoring_three.join(', ') || '-')}</td>
                <td>${escapeHtml(e.clinical_response)}</td>
                <td>${escapeHtml(new Date(e.created_at).toLocaleString())}</td>
                <td>${escapeHtml(e.recorded_by)}</td></tr>`).join('');
            list.innerHTML = `<table class="breakdown">
                <tr><th>Patient</th><th>Risk</th><th>Score</th><th>Scored 3</th><th>Required response</th><th>Raised</th><th>By</th></tr>
                ${rows}</table>`;
        }

        function renderScore(score, escalation) {
            const rows = score.breakdown.map(row => {
                let raw = row.raw_value;
                if (typeof raw === 'boolean') raw = raw ? 'Yes' : 'No (air)';
                return `<tr class="${row.scores_three ? 'three' : ''}">
                    <td>${escapeHtml(row.label)}</td><td>${escapeHtml(raw)}</td><td>${row.sub_score}</td></tr>`;
            }).join('');

            const due = new Date(score.next_observation_due).toLocaleString();
            const dueText = score.hours_until_next_observation === 0 ? 'Continuous monitoring' : due;

            const alertHtml = escalation ? `<div class="alert"><strong>Escalation raised</strong> for patient
                ${escapeHtml(escalation.patient_id)} (${escapeHtml(escalation.risk_level)} risk, score ${escalation.total_score}).
                The clinical team has been alerted.</div>` : '';

            scoreResult.innerHTML = `
                <h2 style="font-size: 1.1rem; color: #1e3a8a;">Observation saved</h2>
                ${alertHtml}
                <span class="risk risk-${score.risk_level.replace(/\s+/g, '-')}">${escapeHtml(score.risk_level)} risk</span>
                <strong style="margin-left: 0.5rem;">Total score: ${score.total_score}</strong>
                <table class="breakdown">
                    <tr><th>Parameter</th><th>Value</th><th>Score</th></tr>
                    ${rows}
                    <tr><th colspan="2">Total</th><th>${score.total_score}</th></tr>
                </table>
                <div class="panel">
                    <strong>Monitoring:</strong> ${escapeHtml(score.monitoring_frequency)}<br />
                    <strong>Next observation due:</strong> ${escapeHtml(dueText)}<br />
                    <strong>Escalation required:</strong> ${score.escalation_required ? 'YES' : 'No'}<br />
                    <strong>Recommended response:</strong> ${escapeHtml(score.clinical_response)}
                </div>`;
            scoreResult.style.display = 'block';
        }
    </script>
</body>

</html>
